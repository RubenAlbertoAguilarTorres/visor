<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Documento de Identificación</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="visor-pdf" allow="autoplay"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileId = params.get('id');

        if (fileId) {
            // Usa el visor de embebido directo de Google que no solicita login ni selección de cuenta
            document.getElementById('visor-pdf').src = 'https://docs.google.com/viewer?srcid=' + fileId + '&pid=explorer&efh=false&a=v&chrome=false&embedded=true';
        } else {
            document.body.innerHTML = '<div style="color:white;text-align:center;margin-top:40vh;font-family:sans-serif;"><h3>No se especificó un documento válido.</h3></div>';
        }
    </script>
</body>
</html>
