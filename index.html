<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor de Carnet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #525659;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px 0;
        }

        #contenedor {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            padding: 0 10px;
        }

        #documento {
            display: block;
            width: 100%;
            max-width: 850px;
            height: auto;

            background: white;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;

            pointer-events: auto;
        }

        #loading {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin-top: 40vh;
            text-align: center;
        }

        #error {
            display: none;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            margin-top: 30vh;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div id="loading">
        Cargando documento...
    </div>

    <div id="error">
        No se pudo cargar el documento.
    </div>

    <div id="contenedor">
        <img
            id="documento"
            alt="Documento"
            draggable="false"
            style="display:none;"
        >
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileId = params.get('id');

        const loading = document.getElementById('loading');
        const documento = document.getElementById('documento');
        const error = document.getElementById('error');

        if (!fileId) {

            loading.style.display = 'none';
            error.style.display = 'block';
            error.textContent = 'No se especificó un ID válido.';

        } else {

            /*
             * Google Drive genera una imagen de vista previa
             * de la primera página del PDF.
             *
             * No abrimos el PDF ni el visor de Google.
             */
            const imagenUrl =
                'https://drive.google.com/thumbnail?id=' +
                encodeURIComponent(fileId) +
                '&sz=w2000';

            documento.src = imagenUrl;

            documento.onload = function () {

                loading.style.display = 'none';
                documento.style.display = 'block';

            };

            documento.onerror = function () {

                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent =
                    'No se pudo cargar el documento. Verifica que el archivo de Google Drive sea público.';

            };
        }

        /*
         * Evitar menú contextual sobre la imagen.
         */
        documento.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        /*
         * Evitar arrastrar la imagen.
         */
        documento.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
